---
# Attacker role
# Prepares the student's attack box: the tools needed to craft shellcode and
# exploits, plus the attack-side lab files (attack-code/ and shellcode/).
# Note: server-code/ is deliberately NOT shipped here, so the Level-2 buffer
# size stays unknown to the student.

- name: Install attack tooling (netcat, python3, 32-bit build support)
  apt:
    name:
      - build-essential
      - gcc-multilib
      - python3
      - netcat-traditional
      - gdb
    state: present
    update_cache: yes

- name: Deploy the shellcode lab files
  copy:
    src: shellcode/
    dest: /home/user/shellcode/
    owner: user
    group: user
    mode: preserve

- name: Deploy the exploit skeleton and helper scripts
  copy:
    src: attack-code/
    dest: /home/user/attack-code/
    owner: user
    group: user
    mode: preserve

# ---------------------------------------------------------------------------
# Task 1 flag (per sandbox) with a REAL privilege boundary (Set-UID).
#   - /opt/flag holds the random flag, owned root, mode 0400: `user` cannot read it.
#   - run-shellcode is a Set-UID-root runner (compiled from call_shellcode.c,
#     owned root, chmod 4755): running it executes the student's codefile_32 as
#     root. The provided shellcode calls setuid(0) first, so the launched bash
#     keeps root and can read /opt/flag.
#   - The student CANNOT read /opt/flag by typing `cat /opt/flag` (they are
#     `user`); it is only reachable via the Set-UID runner executing their
#     shellcode. This closes the "just type the command" bypass.
# ---------------------------------------------------------------------------
# flag_task1 is an APG variable (see variables.yml): the platform generates a
# unique value per sandbox, injects it here, and checks the student's answer
# against it. Plant that exact value; do NOT generate one here.
- name: Plant the Task 1 flag in a root-only file
  copy:
    dest: /opt/flag
    content: "{{ flag_task1 }}\n"
    owner: root
    group: root
    mode: '0400'

- name: Build the Set-UID-root shellcode runner from call_shellcode.c
  command: gcc -m32 -z execstack -o /home/user/shellcode/run-shellcode /home/user/shellcode/call_shellcode.c
  args:
    creates: /home/user/shellcode/run-shellcode

- name: Make the runner Set-UID root (owner root, setuid bit)
  file:
    path: /home/user/shellcode/run-shellcode
    owner: root
    group: root
    mode: '4755'
